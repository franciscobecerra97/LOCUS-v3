[package]
name = "locus-tpass-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Research-grade Yi et al. zero-knowledge TPASS core for LOCUS"
publish = false

[lib]
name = "locus_tpass_core"
path = "src/lib.rs"

[dependencies]
curve25519-dalek = { version = "=4.1.3", features = ["digest", "rand_core", "zeroize"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.8"
thiserror = "=1.0.69"
zeroize = "=1.8.1"

[dev-dependencies]
rand_chacha = "=0.3.1"
