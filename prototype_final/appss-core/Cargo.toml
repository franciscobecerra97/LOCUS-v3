[package]
name = "locus-appss-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Research-grade Figure 4 aPPSS core for LOCUS"
publish = false

[lib]
name = "locus_appss_core"
path = "src/lib.rs"

[dependencies]
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "zeroize"] }
rand_core = "=0.6.4"
sha2 = "=0.10.8"
subtle = "=2.6.1"
thiserror = "=1.0.69"
zeroize = "=1.8.1"

[dev-dependencies]
rand_chacha = "=0.3.1"
