[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "locus-research"
version = "0.1.0"
description = "Research prototype for distributed private-key recovery"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3==1.43.51", "cryptography==49.0.0"]

[dependency-groups]
dev = [
    "maturin==1.14.1",
    "mypy==2.3.0",
    "ruff==0.15.20",
]

[tool.uv]
package = false
required-version = "==0.11.29"

[tool.maturin]
bindings = "pyo3"
manifest-path = "tpass-python/Cargo.toml"
module-name = "locus._tpass_native"
python-source = "prototype"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["tasks.py", "prototype"]
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
