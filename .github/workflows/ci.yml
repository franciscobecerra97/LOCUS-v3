name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Final prototype checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Synchronize frozen environment
        working-directory: prototype_final
        run: uv sync --frozen

      - name: Run focused integrated checks
        working-directory: prototype_final
        run: uv run --frozen python tasks.py integrated-check

  integrated-smoke:
    name: Final integrated smoke
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Synchronize frozen environment
        working-directory: prototype_final
        run: uv sync --frozen

      - name: Run disposable integrated workflow
        working-directory: prototype_final
        run: uv run --frozen python tasks.py integrated-smoke
