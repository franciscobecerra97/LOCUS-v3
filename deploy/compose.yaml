x-locus-runtime: &locus-runtime
  image: "${LOCUS_REFERENCE_IMAGE:?set LOCUS_REFERENCE_IMAGE}"
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  ulimits:
    core:
      soft: 0
      hard: 0
  restart: "no"

x-party-runtime: &party-runtime
  <<: *locus-runtime
  user: "65532:65532"
  networks:
    - recovery
  depends_on:
    provisioner:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-m", "locus.deployment", "party-health", "--root", "/var/lib/locus"]
    interval: 2s
    timeout: 4s
    retries: 30
    start_period: 5s
  stop_grace_period: 3s

x-client-runtime: &client-runtime
  <<: *locus-runtime
  user: "65532:65532"
  environment:
    LOCUS_S3_ACCESS_KEY: "${LOCUS_S3_ACCESS_KEY:?set LOCUS_S3_ACCESS_KEY}"
    LOCUS_S3_BUCKET: "${LOCUS_S3_BUCKET:?set LOCUS_S3_BUCKET}"
    LOCUS_S3_ENDPOINT: http://s3:8333
    LOCUS_S3_PREFIX: "${LOCUS_S3_PREFIX:?set LOCUS_S3_PREFIX}"
    LOCUS_S3_SECRET_KEY: "${LOCUS_S3_SECRET_KEY:?set LOCUS_S3_SECRET_KEY}"
  volumes:
    - type: volume
      source: client-data
      target: /var/lib/locus-client
      read_only: true
  networks:
    - cloud
    - resolver
    - recovery
  depends_on:
    resolver:
      condition: service_healthy
    s3:
      condition: service_healthy
    party1:
      condition: service_healthy
    party2:
      condition: service_healthy
    party3:
      condition: service_healthy
    party4:
      condition: service_healthy
    party5:
      condition: service_healthy

services:
  provisioner:
    <<: *locus-runtime
    user: "0:0"
    network_mode: none
    environment:
      LOCUS_OPERATOR_DIAGNOSTICS: "1"
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
    command:
      - python
      - -m
      - locus.deployment
      - provision
      - --party-root
      - /party1
      - --party-root
      - /party2
      - --party-root
      - /party3
      - --party-root
      - /party4
      - --party-root
      - /party5
      - --client-root
      - /client
      - --fixture
      - /fixtures/cues.json
      - --owner-uid
      - "65532"
      - --owner-gid
      - "65532"
    volumes:
      - type: volume
        source: party1-data
        target: /party1
      - type: volume
        source: party2-data
        target: /party2
      - type: volume
        source: party3-data
        target: /party3
      - type: volume
        source: party4-data
        target: /party4
      - type: volume
        source: party5-data
        target: /party5
      - type: volume
        source: client-data
        target: /client
      - type: bind
        source: ./fixtures
        target: /fixtures
        read_only: true

  resolver:
    <<: *locus-runtime
    user: "65532:65532"
    command: ["python", "-m", "locus.deployment", "resolver", "--fixture", "/fixtures/cues.json"]
    volumes:
      - type: bind
        source: ./fixtures
        target: /fixtures
        read_only: true
    networks:
      - resolver
    healthcheck:
      test: ["CMD", "python", "-m", "locus.deployment", "resolver-health", "--url", "http://127.0.0.1:8080/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  s3:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    command:
      - -alsologtostderr=false
      - -logdir=/tmp
      - -stderrthreshold=ERROR
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: "${LOCUS_S3_ACCESS_KEY:?set LOCUS_S3_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${LOCUS_S3_SECRET_KEY:?set LOCUS_S3_SECRET_KEY}"
      S3_BUCKET: "${LOCUS_S3_BUCKET:?set LOCUS_S3_BUCKET}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - type: volume
        source: s3-data
        target: /data
    networks:
      - cloud
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ulimits:
      core:
        soft: 0
        hard: 0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  party1:
    <<: *party-runtime
    command: ["python", "-m", "locus.party_http", "--config", "/var/lib/locus/service.json"]
    volumes:
      - type: volume
        source: party1-data
        target: /var/lib/locus

  party2:
    <<: *party-runtime
    command: ["python", "-m", "locus.party_http", "--config", "/var/lib/locus/service.json"]
    volumes:
      - type: volume
        source: party2-data
        target: /var/lib/locus

  party3:
    <<: *party-runtime
    command: ["python", "-m", "locus.party_http", "--config", "/var/lib/locus/service.json"]
    volumes:
      - type: volume
        source: party3-data
        target: /var/lib/locus

  party4:
    <<: *party-runtime
    command: ["python", "-m", "locus.party_http", "--config", "/var/lib/locus/service.json"]
    volumes:
      - type: volume
        source: party4-data
        target: /var/lib/locus

  party5:
    <<: *party-runtime
    command: ["python", "-m", "locus.party_http", "--config", "/var/lib/locus/service.json"]
    volumes:
      - type: volume
        source: party5-data
        target: /var/lib/locus

  client:
    <<: *client-runtime
    command:
      - python
      - -m
      - locus.deployment
      - client
      - --client-root
      - /var/lib/locus-client
      - --resolver-url
      - http://resolver:8080/v1/cues

  demo:
    <<: *client-runtime
    profiles: ["demo"]
    command:
      - python
      - -m
      - locus.deployment
      - client
      - --client-root
      - /var/lib/locus-client
      - --resolver-url
      - http://resolver:8080/v1/cues

  benchmark:
    <<: *client-runtime
    profiles: ["benchmark"]
    command:
      - python
      - -m
      - locus.deployment
      - benchmark
      - --client-root
      - /var/lib/locus-client
      - --resolver-url
      - http://resolver:8080/v1/cues
      - --runs
      - "${LOCUS_BENCHMARK_RUNS:-2}"

  attack:
    <<: *client-runtime
    profiles: ["attack"]
    command:
      - python
      - -m
      - locus.attack_runner
      - --scenario
      - "${LOCUS_ATTACK_SCENARIO:-resolver-unavailable-v1}"
      - --client-root
      - /var/lib/locus-client
      - --resolver-url
      - http://resolver:8080/v1/cues
      - --restart-checkpoint-dir
      - /tmp

  cloud-snapshot-collector:
    <<: *locus-runtime
    user: "0:0"
    profiles: ["snapshot-attack"]
    cap_add:
      - DAC_READ_SEARCH
    environment:
      LOCUS_S3_ACCESS_KEY: "${LOCUS_S3_ACCESS_KEY:?set LOCUS_S3_ACCESS_KEY}"
      LOCUS_S3_BUCKET: "${LOCUS_S3_BUCKET:?set LOCUS_S3_BUCKET}"
      LOCUS_S3_ENDPOINT: http://s3:8333
      LOCUS_S3_PREFIX: "${LOCUS_S3_PREFIX:?set LOCUS_S3_PREFIX}"
      LOCUS_S3_SECRET_KEY: "${LOCUS_S3_SECRET_KEY:?set LOCUS_S3_SECRET_KEY}"
    volumes:
      - type: volume
        source: client-data
        target: /var/lib/locus-client
        read_only: true
      - type: volume
        source: cloud-snapshot-data
        target: /var/lib/locus-snapshot
    networks:
      - cloud
    depends_on:
      provisioner:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    command:
      - python
      - -m
      - locus.cloud_snapshot
      - --client-root
      - /var/lib/locus-client
      - --snapshot-root
      - /var/lib/locus-snapshot

  cloud-snapshot-attack:
    <<: *locus-runtime
    user: "65532:65532"
    profiles: ["snapshot-attack"]
    network_mode: none
    volumes:
      - type: volume
        source: cloud-snapshot-data
        target: /var/lib/locus-snapshot
        read_only: true
    command:
      - python
      - -m
      - locus.attack_runner
      - --scenario
      - cloud-snapshot-no-offline-predicate-v1
      - --snapshot-root
      - /var/lib/locus-snapshot

  party-snapshot-collector:
    <<: *locus-runtime
    user: "0:0"
    profiles: ["party-snapshot-attack"]
    network_mode: none
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - type: volume
        source: party1-data
        target: /var/lib/locus-party
        read_only: true
      - type: volume
        source: party-snapshot-data
        target: /var/lib/locus-party-snapshot
    depends_on:
      provisioner:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - locus.party_snapshot
      - --party-root
      - /var/lib/locus-party
      - --snapshot-root
      - /var/lib/locus-party-snapshot

  party-snapshot-attack:
    <<: *locus-runtime
    user: "65532:65532"
    profiles: ["party-snapshot-attack"]
    network_mode: none
    volumes:
      - type: volume
        source: party-snapshot-data
        target: /var/lib/locus-party-snapshot
        read_only: true
    command:
      - python
      - -m
      - locus.attack_runner
      - --scenario
      - t-minus-one-party-snapshot-no-offline-predicate-v1
      - --snapshot-root
      - /var/lib/locus-party-snapshot

  combined-cloud-snapshot-collector:
    <<: *locus-runtime
    user: "0:0"
    profiles: ["combined-snapshot-attack"]
    cap_add:
      - DAC_READ_SEARCH
    environment:
      LOCUS_S3_ACCESS_KEY: "${LOCUS_S3_ACCESS_KEY:?set LOCUS_S3_ACCESS_KEY}"
      LOCUS_S3_BUCKET: "${LOCUS_S3_BUCKET:?set LOCUS_S3_BUCKET}"
      LOCUS_S3_ENDPOINT: http://s3:8333
      LOCUS_S3_PREFIX: "${LOCUS_S3_PREFIX:?set LOCUS_S3_PREFIX}"
      LOCUS_S3_SECRET_KEY: "${LOCUS_S3_SECRET_KEY:?set LOCUS_S3_SECRET_KEY}"
    volumes:
      - type: volume
        source: client-data
        target: /var/lib/locus-client
        read_only: true
      - type: volume
        source: combined-snapshot-data
        target: /var/lib/locus-combined
    networks:
      - cloud
    depends_on:
      provisioner:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    command:
      - python
      - -m
      - locus.cloud_snapshot
      - --client-root
      - /var/lib/locus-client
      - --snapshot-root
      - /var/lib/locus-combined/cloud

  combined-party-snapshot-collector:
    <<: *locus-runtime
    user: "0:0"
    profiles: ["combined-snapshot-attack"]
    network_mode: none
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - type: volume
        source: party1-data
        target: /var/lib/locus-party
        read_only: true
      - type: volume
        source: combined-snapshot-data
        target: /var/lib/locus-combined
    depends_on:
      provisioner:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - locus.party_snapshot
      - --party-root
      - /var/lib/locus-party
      - --snapshot-root
      - /var/lib/locus-combined/party

  combined-snapshot-finalizer:
    <<: *locus-runtime
    user: "0:0"
    profiles: ["combined-snapshot-attack"]
    network_mode: none
    volumes:
      - type: volume
        source: combined-snapshot-data
        target: /var/lib/locus-combined
    command:
      - python
      - -m
      - locus.combined_snapshot
      - --snapshot-root
      - /var/lib/locus-combined

  combined-snapshot-attack:
    <<: *locus-runtime
    user: "65532:65532"
    profiles: ["combined-snapshot-attack"]
    network_mode: none
    volumes:
      - type: volume
        source: combined-snapshot-data
        target: /var/lib/locus-combined
        read_only: true
    command:
      - python
      - -m
      - locus.attack_runner
      - --scenario
      - cloud-plus-t-minus-one-party-snapshot-no-offline-predicate-v1
      - --snapshot-root
      - /var/lib/locus-combined

volumes:
  cloud-snapshot-data:
  combined-snapshot-data:
  client-data:
  party1-data:
  party2-data:
  party3-data:
  party4-data:
  party5-data:
  party-snapshot-data:
  s3-data:

networks:
  cloud:
    internal: true
  recovery:
    internal: true
  resolver:
    internal: true
