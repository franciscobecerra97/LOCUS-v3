services:
  s3:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: "${LOCUS_S3_ACCESS_KEY:?set LOCUS_S3_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${LOCUS_S3_SECRET_KEY:?set LOCUS_S3_SECRET_KEY}"
      S3_BUCKET: "${LOCUS_S3_BUCKET:?set LOCUS_S3_BUCKET}"
    ports:
      - "127.0.0.1:${LOCUS_S3_PORT:?set LOCUS_S3_PORT}:8333"
    volumes:
      - s3-data:/data
    networks:
      - cloud
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ulimits:
      core:
        soft: 0
        hard: 0
    restart: "no"

volumes:
  s3-data:

networks:
  cloud:
